name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

env:
  FFMPEG_VERSION: 8.1.2

jobs:
  # Build natives from source on each platform, run the smoke tests against
  # them, and upload the staged set for the release workflow.
  natives-macos:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: brew install meson ninja nasm pkg-config

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: build-natives/macos-arm64.sh

      - name: Test against built natives
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/natives/macos-arm64/
          if-no-files-found: error

  natives-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            make
            nasm
            diffutils
            curl

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: ./build-natives/windows-x64.sh

      - name: Test against built natives
        shell: pwsh
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/natives/windows-x64/
          if-no-files-found: error

  natives-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm pkg-config patchelf

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: build-natives/linux-x64.sh

      - name: Test against built natives
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/natives/linux-x64/
          if-no-files-found: error
