name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FFMPEG_VERSION: 8.1.2

jobs:
  # Build natives from source on each platform, run the smoke tests against
  # them, and upload the staged set for the deploy job.
  natives-macos:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: brew install meson ninja nasm pkg-config

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: build-natives/macos-arm64.sh

      - name: Test against built natives
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/natives/macos-arm64/
          if-no-files-found: error

  natives-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            make
            nasm
            diffutils
            curl

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: ./build-natives/windows-x64.sh

      - name: Test against built natives
        shell: pwsh
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/natives/windows-x64/
          if-no-files-found: error

  natives-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm pkg-config patchelf

      - name: Fetch FFmpeg source
        run: |
          mkdir -p build
          curl -sfL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" | tar xJ -C build

      - name: Build natives (FFmpeg + dav1d)
        run: build-natives/linux-x64.sh

      - name: Test against built natives
        run: mvn -B clean install

      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/natives/linux-x64/
          if-no-files-found: error

  release:
    needs: [natives-macos, natives-windows, natives-linux]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # workflow_dispatch: release if tag doesn't already exist
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh release view "v${CURRENT}" > /dev/null 2>&1; then
              echo "Release v${CURRENT} already exists — will deploy only"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            PREVIOUS=$(git show HEAD~1:pom.xml | grep -m1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
            echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
            if [ "$CURRENT" != "$PREVIOUS" ] && [[ "$CURRENT" != *SNAPSHOT* ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.current }}
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping creation"
          else
            gh release create "v${VERSION}" \
              --target main \
              --title "${VERSION}" \
              --generate-notes
          fi

  deploy:
    needs: release
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: 22
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - uses: actions/download-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/natives/macos-arm64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/natives/windows-x64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/natives/linux-x64/

      - name: Deploy to Maven Central
        # Tests already ran against real natives on the platform jobs.
        # native.classifier pinned: the linux-x64 OS profile would otherwise
        # flip the default jar execution and drop the macos classifier.
        run: mvn -B clean deploy -P release,all-natives -Dnative.classifier=macos-arm64 -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
